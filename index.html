<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b141a">
<title>Chat</title>
<script src="https://cdn.jsdelivr.net/npm/parse@4.3.1/dist/parse.min.js"></script>
<style>
:root{--bg:#0b141a;--card:#111b21;--line:#233138;--tx:#e9edef;--mut:#8696a0;--g:#25d366;--gd:#128c7e;--err:#ff6b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
input{user-select:text}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
.scr{position:fixed;inset:0;display:none;flex-direction:column;padding:max(24px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom));overflow:auto}
.scr.on{display:flex;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.wrap{width:100%;max-width:400px;margin:auto}
.logo{width:72px;height:72px;border-radius:22px;background:linear-gradient(135deg,var(--g),var(--gd));display:grid;place-items:center;margin:0 auto 18px;box-shadow:0 10px 30px #25d36633}
.logo svg{width:38px;height:38px;fill:#fff}
h1{font-size:24px;margin:0 0 6px;text-align:center}
p.s{color:var(--mut);text-align:center;margin:0 0 24px}
label{display:block;font-size:12px;color:var(--mut);margin:14px 0 6px}
input{width:100%;background:var(--card);border:1.5px solid var(--line);color:var(--tx);border-radius:14px;padding:14px 16px;font-size:16px;outline:0;transition:.2s}
input:focus{border-color:var(--g)}
.otp{text-align:center;font-size:28px;letter-spacing:12px;font-weight:700}
button.p{width:100%;margin-top:22px;background:var(--g);color:#06260f;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:700;transition:.15s}
button.p:active{transform:scale(.97)}button.p:disabled{opacity:.6}
button.l{background:none;border:0;color:var(--g);font-size:14px;padding:12px;width:100%;margin-top:6px}
.err{color:var(--err);font-size:13px;min-height:18px;margin-top:10px;text-align:center}
.hint{font-size:12px;color:var(--mut);margin-top:6px}
/* app shell */
#app{padding:0}
.top{padding:max(14px,env(safe-area-inset-top)) 18px 12px;font-size:21px;font-weight:700;background:var(--card);border-bottom:1px solid var(--line)}
.pane{flex:1;overflow:auto;padding:18px;display:none}.pane.on{display:block}
.tabs{display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;background:none;border:0;color:var(--mut);padding:10px 0;font-size:11px}
.tabs button.on{color:var(--g)}
.me{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.av{width:64px;height:64px;border-radius:50%;background:var(--gd);display:grid;place-items:center;font-size:26px;font-weight:700;text-transform:uppercase}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#202c33;padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:9}
.toast.on{opacity:1}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="scr" id="login"><div class="wrap">
  <div class="logo"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2z"/></svg></div>
  <h1>Welcome back</h1><p class="s">Login karein</p>
  <label>Username ya Email</label><input id="lid" autocomplete="username" autocapitalize="none">
  <label>Password</label><input id="lpw" type="password" autocomplete="current-password">
  <div class="err" id="e-login"></div>
  <button class="p" id="b-login">Login</button>
  <button class="l" data-go="forgot1">Password bhool gaye?</button>
  <button class="l" data-go="su1">Naya account banayein</button>
</div></div>

<!-- SIGNUP: email -->
<div class="scr" id="su1"><div class="wrap">
  <h1>Account banayein</h1><p class="s">Email par OTP aayega</p>
  <label>Email</label><input id="sem" type="email" autocomplete="email" autocapitalize="none">
  <div class="err" id="e-su1"></div>
  <button class="p" id="b-su1">OTP bhejein</button>
  <button class="l" data-go="login">Wapas login</button>
</div></div>

<!-- OTP (signup + reset) -->
<div class="scr" id="otp"><div class="wrap">
  <h1>OTP daalein</h1><p class="s" id="otp-sub"></p>
  <input class="otp" id="ocode" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="••••••">
  <div class="err" id="e-otp"></div>
  <button class="p" id="b-otp">Verify</button>
  <button class="l" id="b-resend">Dobara bhejein</button>
</div></div>

<!-- SIGNUP: username + password -->
<div class="scr" id="su2"><div class="wrap">
  <h1>Profile set karein</h1><p class="s">Username aur password chunein</p>
  <label>Username</label><input id="sun" autocomplete="off" autocapitalize="none" maxlength="25">
  <div class="hint">11 se 25 characters: a-z, 0-9, . aur _</div>
  <label>Password</label><input id="spw" type="password" autocomplete="new-password">
  <div class="err" id="e-su2"></div>
  <button class="p" id="b-su2">Account banayein</button>
</div></div>

<!-- FORGOT -->
<div class="scr" id="forgot1"><div class="wrap">
  <h1>Password reset</h1><p class="s">Email par OTP aayega</p>
  <label>Email</label><input id="fem" type="email" autocomplete="email" autocapitalize="none">
  <div class="err" id="e-forgot1"></div>
  <button class="p" id="b-forgot1">OTP bhejein</button>
  <button class="l" data-go="login">Wapas login</button>
</div></div>
<div class="scr" id="forgot2"><div class="wrap">
  <h1>Naya password</h1><p class="s">Kam se kam 8 characters</p>
  <label>Naya password</label><input id="npw" type="password" autocomplete="new-password">
  <div class="err" id="e-forgot2"></div>
  <button class="p" id="b-forgot2">Password badlein</button>
</div></div>

<div class="scr" id="app"></div>
<div class="toast" id="toast"></div>

<script>
// Public keys (App ID + JavaScript Key). Master Key yahan KABHI mat daalna.
Parse.initialize('AVr8v6ZlRZE5954Ud9LuwberN9LDa7WbSnrnHVFV', '2fynAXdANDztkc4fqEBOt5jYhs7G8TN13VxlR793');
Parse.serverURL = 'https://parseapi.back4app.com';

const $ = id => document.getElementById(id);
const st = { email: '', purpose: 'signup', ticket: '', timer: 0 };

function show(id) {
  document.querySelectorAll('.scr').forEach(s => s.classList.toggle('on', s.id === id));
  document.querySelectorAll('.err').forEach(e => e.textContent = '');
}
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('on'); setTimeout(() => el.classList.remove('on'), 2500); }
async function run(btn, errId, fn) {
  const old = btn.textContent; btn.disabled = true; btn.textContent = 'Please wait…'; $(errId).textContent = '';
  try { await fn(); } catch (e) { $(errId).textContent = e.message || 'Kuch galat hua'; }
  btn.disabled = false; btn.textContent = old;
}
document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => show(b.dataset.go));

function openOtp(email, purpose) {
  st.email = email; st.purpose = purpose;
  $('otp-sub').textContent = email + ' par code bheja gaya';
  $('ocode').value = ''; show('otp'); setTimeout(() => $('ocode').focus(), 300); cooldown();
}
function cooldown() {
  clearInterval(st.timer); let n = 60; const b = $('b-resend'); b.disabled = true;
  st.timer = setInterval(() => {
    b.textContent = n > 0 ? 'Dobara bhejein (' + n-- + 's)' : 'Dobara bhejein';
    if (n < 0) { clearInterval(st.timer); b.disabled = false; }
  }, 1000);
}
async function sendCode(email, purpose) { await Parse.Cloud.run('sendOtp', { email, purpose }); }

// signup
$('b-su1').onclick = e => run(e.target, 'e-su1', async () => {
  const email = $('sem').value.trim().toLowerCase();
  await sendCode(email, 'signup'); openOtp(email, 'signup');
});
// forgot
$('b-forgot1').onclick = e => run(e.target, 'e-forgot1', async () => {
  const email = $('fem').value.trim().toLowerCase();
  await sendCode(email, 'reset'); openOtp(email, 'reset');
});
$('b-resend').onclick = e => run(e.target, 'e-otp', async () => { await sendCode(st.email, st.purpose); cooldown(); toast('Code bhej diya'); });
$('ocode').oninput = e => { e.target.value = e.target.value.replace(/\D/g, ''); if (e.target.value.length === 6) $('b-otp').click(); };
$('b-otp').onclick = e => run(e.target, 'e-otp', async () => {
  const r = await Parse.Cloud.run('verifyOtp', { email: st.email, purpose: st.purpose, code: $('ocode').value });
  st.ticket = r.ticket; show(st.purpose === 'signup' ? 'su2' : 'forgot2');
});
$('b-su2').onclick = e => run(e.target, 'e-su2', async () => {
  const username = $('sun').value.trim().toLowerCase(), password = $('spw').value;
  await Parse.Cloud.run('completeSignup', { email: st.email, ticket: st.ticket, username, password });
  await Parse.User.logIn(username, password); enter();
});
$('b-forgot2').onclick = e => run(e.target, 'e-forgot2', async () => {
  await Parse.Cloud.run('completeReset', { email: st.email, ticket: st.ticket, password: $('npw').value });
  show('login'); toast('Password badal gaya, ab login karein');
});
// login
$('b-login').onclick = e => run(e.target, 'e-login', async () => {
  const id = $('lid').value.trim();
  const { username } = await Parse.Cloud.run('lookupUsername', { id });
  try { await Parse.User.logIn(username, $('lpw').value); } catch (x) { throw new Error('Username/email ya password galat hai'); }
  enter();
});
['lid', 'lpw'].forEach(i => $(i).onkeydown = e => e.key === 'Enter' && $('b-login').click());

function enter() { show('app'); window.startApp(Parse.User.current()); }
(async () => {
  try { if (Parse.User.current()) { await Parse.User.current().fetch(); return enter(); } } catch (e) { try { await Parse.User.logOut(); } catch (x) {} }
  show('login');
})();
</script>
<script src="app.js"></script>
</body>
</html>
